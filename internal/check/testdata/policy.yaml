trusted_git_directories:
  - /work

denied:
  - dd
  - bin/publish
  - git push
  - patterns: ['^rm -(rf|fr) /$']
  - description: Writing a private key
    reason: Ask a human first.
    paths: ['~/.ssh/**', '~/**/*.pem']

allowed:
  - cd
  - ls
  - cat
  - python3
  - git status
  - paths: /work/**

  - description: Pushing a branch of the app
    patterns: ['^git (-C \S+ )?push origin \S+$']
    only:
      dirs: [/work/app]
      branches:
        - not: [main]
